text: "jello"

# Navigation is scoped by product + language.
# Pages without a `product:` front-matter value default to "ai", the current
# policies (see header.html / footer.html). The superseded documents carry an
# explicit `product: legacy`.
groups:
  # Legacy product
  - product: legacy
    language: en
    links:
      - title: "Terms and Conditions"
        url: /legacy/terms/en/
      - title: "Privacy Policy"
        url: /legacy/privacy/en/
  - product: legacy
    language: es
    links:
      - title: "Terminos y Condiciones"
        url: /legacy/terms/
      - title: "Política de Privacidad"
        url: /legacy/privacy/
  # AI product — current policies, served at the canonical /terms/ and /privacy/
  - product: ai
    language: en
    links:
      - title: "Terms and Conditions"
        url: /terms/en/
      - title: "Privacy Policy"
        url: /privacy/en/
  - product: ai
    language: es
    links:
      - title: "Términos y Condiciones"
        url: /terms/
      - title: "Política de Privacidad"
        url: /privacy/
