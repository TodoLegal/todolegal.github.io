# Navigation is scoped by product + language.
# Pages without a `product:` front-matter value default to "legacy" (see header.html).
groups:
  # Legacy product
  - product: legacy
    language: en
    links:
      - title: "Terms and Conditions"
        url: /terms/en/
      - title: "Privacy Policy"
        url: /privacy/en/
  - product: legacy
    language: es
    links:
      - title: "Terminos y Condiciones"
        url: /terms/
      - title: "Política de Privacidad"
        url: /privacy/
  # AI product
  - product: ai
    language: en
    links:
      - title: "Terms and Conditions"
        url: /ai/terms/en/
      - title: "Privacy Policy"
        url: /ai/privacy/en/
  - product: ai
    language: es
    links:
      - title: "Términos y Condiciones"
        url: /ai/terms/
      - title: "Política de Privacidad"
        url: /ai/privacy/
